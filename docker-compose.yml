version: "3.8"

services:
    # PHP-FPM Service
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                user: laravel
                uid: 1000
        container_name: eppenda_php
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - .env.docker
        volumes:
            - .:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - eppenda_network
        depends_on:
            - mysql
            - redis

    # Nginx Service
    nginx:
        image: nginx:alpine
        container_name: eppenda_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - eppenda_network
        depends_on:
            - php

    # MySQL Service
    mysql:
        image: mysql:8.0
        container_name: eppenda_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-eppenda}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_USER: ${DB_USERNAME:-eppenda}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - eppenda_network
        command: --default-authentication-plugin=mysql_native_password

    # Redis Service
    redis:
        image: redis:alpine
        container_name: eppenda_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - eppenda_network
        command: redis-server --appendonly yes

    # phpMyAdmin Service
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: eppenda_phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: ${DB_USERNAME:-eppenda}
            PMA_PASSWORD: ${DB_PASSWORD:-secret}
            UPLOAD_LIMIT: 100M
        ports:
            - "8081:80"
        networks:
            - eppenda_network
        depends_on:
            - mysql

    # Node.js for asset compilation (optional, run as needed)
    node:
        image: node:20-alpine
        container_name: eppenda_node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - eppenda_network
        profiles:
            - assets

    # Queue Worker (optional)
    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                user: laravel
                uid: 1000
        container_name: eppenda_queue
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        volumes:
            - .:/var/www/html
        networks:
            - eppenda_network
        depends_on:
            - mysql
            - redis
        profiles:
            - queue

    # Scheduler (optional)
    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                user: laravel
                uid: 1000
        container_name: eppenda_scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
        volumes:
            - .:/var/www/html
        networks:
            - eppenda_network
        depends_on:
            - mysql
            - redis
        profiles:
            - scheduler

networks:
    eppenda_network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
    redis_data:
        driver: local
